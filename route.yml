apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-mcp-route
  namespace: workshop1
spec:
  parentRefs:
    - name: aalwg-gtw
      namespace: aalwg
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "mcp.172.25.39.200.nip.io" # Replace with your domain or remove to match all hosts
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-mcp-service
          port: 3000