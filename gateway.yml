---
apiVersion: v1 
kind: Namespace
metadata:
  name: aalwg

--- 
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: 
  name: aalwg-gtw
  namespace: aalwg 
spec:
  gatewayClassName: cilium
  listeners: 
  - name: http 
    port: 80
    protocol: HTTP 
    hostname: '*.172.25.39.200.nip.io'
    allowedRoutes: 
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway: aalwg-gtw