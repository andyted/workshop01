---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-policy
spec:
  loadBalancerIPs: true
  interfaces:
  - ^eth[0-9]+
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: main-pool
spec:
  blocks:
  - start: 172.25.39.200
    stop: 172.25.39.210
#  - start: 192.168.65.200
#    stop: 192.168.65.210
